<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="문제를 정의하고 판단 가능한 형태로 만든 김동욱의 프로젝트 포트폴리오">
  <title>김동욱 · Project Portfolio</title>
  <style>
    :root {
      --paper: #08090a;
      --ink: #e8e4dc;
      --muted: #8d8b85;
      --line: #292a2d;
      --card: #0e0f11;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 14% -8%, rgba(255,255,255,.055), transparent 32%),
        linear-gradient(135deg, #090a0c 0%, var(--paper) 54%, #0b0c0e 100%);
      color: var(--ink);
      font-family: Arial, Pretendard, "Noto Sans KR", "Apple SD Gothic Neo",
        "Malgun Gothic", sans-serif;
    }

    body.modal-open { overflow: hidden; }
    button, a { font: inherit; }
    a { color: inherit; text-decoration: none; }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    .shell {
      width: min(100%, 1600px);
      min-height: 100svh;
      margin: 0 auto;
      padding: 0 clamp(22px, 4vw, 68px);
    }

    .site-header {
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      font-size: 13px;
      font-weight: 760;
      letter-spacing: .15em;
    }

    .site-header nav {
      display: flex;
      gap: 24px;
      font-size: 13px;
      font-weight: 650;
    }

    .site-header nav a {
      position: relative;
    }

    .site-header nav a::after {
      content: "";
      position: absolute;
      right: 100%;
      bottom: -5px;
      left: 0;
      height: 1px;
      background: currentColor;
      transition: right 180ms ease;
    }

    .site-header nav a:hover::after { right: 0; }

    .hero {
      padding: 24px 0 22px;
    }

    .hero-kicker {
      margin: 0;
      color: var(--muted);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(14px, 1.7vw, 26px);
    }

    .project-card {
      min-width: 0;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 0;
      background: var(--card);
      box-shadow: none;
      transition: transform 220ms ease, border-color 220ms ease, background 220ms ease;
    }

    .project-card::before {
      content: "";
      position: absolute;
      z-index: 2;
      inset: 0 0 auto;
      height: 2px;
      background: var(--accent);
      transform: scaleX(.18);
      transform-origin: left;
      transition: transform 260ms ease;
    }

    .project-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      background: #121316;
    }

    .project-card:hover::before { transform: scaleX(1); }

    .card-main {
      width: 100%;
      flex: 1;
      display: grid;
      grid-template-columns: auto 1fr;
      grid-template-rows: auto auto auto 1fr auto auto;
      padding: 25px 25px 18px;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }

    .project-number {
      color: var(--accent);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 12px;
      font-weight: 760;
    }

    .project-category {
      justify-self: end;
      color: var(--muted);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 10px;
      font-weight: 680;
      letter-spacing: .09em;
    }

    .project-card h2 {
      grid-column: 1 / -1;
      min-height: 64px;
      margin: 20px 0 10px;
      font-size: clamp(20px, 1.55vw, 25px);
      font-weight: 650;
      line-height: 1.28;
      letter-spacing: -.04em;
      word-break: keep-all;
    }

    .card-main > p {
      grid-column: 1 / -1;
      min-height: 64px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
      word-break: keep-all;
    }

    .project-shot-frame {
      grid-column: 1 / -1;
      height: 150px;
      margin: 20px 0 17px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--accent) 27%, var(--line));
      background: #f1f1ef;
    }

    .project-shot {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .project-shot--tax {
      object-position: center;
    }

    .project-shot--toeic {
      object-fit: contain;
      background: #f4f4f4;
    }

    .project-shot--place {
      object-position: top center;
    }

    .project-signal {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--accent);
      font-size: 11px;
      font-weight: 680;
    }

    .project-signal b {
      color: var(--ink);
      font-size: 11px;
      font-weight: 680;
    }

    .card-links,
    .modal-links {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .card-links {
      padding: 14px 25px 17px;
      border-top: 1px solid var(--line);
    }

    .card-links a,
    .modal-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 0;
      font-size: 10px;
      font-weight: 680;
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease;
    }

    .card-links a:hover,
    .modal-links a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .card-links .primary,
    .modal-links .primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #08090a;
    }

    .site-footer {
      min-height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 9px;
      letter-spacing: .06em;
    }

    dialog {
      width: min(900px, calc(100% - 48px));
      max-height: min(88svh, 860px);
      overflow-y: auto;
      padding: 0;
      border: 1px solid #343538;
      border-radius: 0;
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 30px 100px rgba(0,0,0,.72);
      scrollbar-color: var(--accent) #111214;
    }

    dialog::backdrop {
      background: rgba(0,0,0,.78);
      backdrop-filter: blur(10px);
    }

    .modal-toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      min-height: 62px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(8,9,10,.95);
      backdrop-filter: blur(14px);
    }

    .modal-toolbar-title {
      max-width: 280px;
      overflow: hidden;
      color: var(--muted);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .08em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-toolbar .modal-links {
      margin-left: auto;
    }

    .modal-close {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 25px;
      line-height: 1;
    }

    .modal-close:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .modal-heading {
      padding: 48px clamp(28px, 6vw, 72px) 39px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(100deg, var(--accent-soft), transparent 72%);
    }

    .modal-heading > p {
      margin: 0 0 16px;
      color: var(--accent);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .09em;
    }

    .modal-heading h2 {
      max-width: 690px;
      margin: 0 0 15px;
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.17;
      letter-spacing: -.05em;
      word-break: keep-all;
    }

    .modal-heading > span {
      display: block;
      max-width: 670px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .modal-body {
      display: grid;
      gap: 34px;
      padding: 42px clamp(28px, 6vw, 72px);
    }

    .modal-body h3,
    .modal-body blockquote span {
      display: block;
      margin: 0 0 12px;
      color: var(--accent);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 10px;
      font-weight: 760;
      letter-spacing: .12em;
    }

    .modal-body section p {
      margin: 0;
      color: #b7b4ad;
      font-size: 14px;
      line-height: 1.9;
      word-break: keep-all;
    }

    .modal-body blockquote {
      margin: 0;
      padding: 23px 25px;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      font-size: clamp(19px, 2.2vw, 27px);
      font-weight: 680;
      line-height: 1.48;
      letter-spacing: -.03em;
      word-break: keep-all;
    }

    .modal-body ol {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 1px;
      margin: 0;
      padding: 1px;
      background: var(--line);
      list-style: none;
      counter-reset: steps;
    }

    .modal-body li {
      min-height: 104px;
      padding: 19px;
      background: var(--card);
      color: #b7b4ad;
      counter-increment: steps;
      font-size: 13px;
      line-height: 1.7;
    }

    .modal-body li::before {
      content: "0" counter(steps);
      display: block;
      margin-bottom: 9px;
      color: var(--accent);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 9px;
      font-weight: 760;
    }

    .modal-two-column {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 34px;
    }

    .modal-two-column section + section {
      padding-left: 34px;
      border-left: 1px solid var(--line);
    }

    @media (max-width: 960px) {
      .project-grid { grid-template-columns: 1fr; }
      .project-card h2, .card-main > p { min-height: 0; }
      .project-shot-frame { height: clamp(170px, 30vw, 280px); }
    }

    @media (max-width: 640px) {
      .shell { padding: 0 16px; }
      .site-header { height: 62px; }
      .site-header nav { gap: 14px; font-size: 11px; }
      .hero { padding: 20px 0 18px; }
      .project-shot-frame { height: 160px; }
      .card-main { padding: 22px 20px 17px; }
      .card-links { padding: 13px 20px 16px; }

      dialog {
        width: 100%;
        max-width: none;
        max-height: 94svh;
        margin: auto 0 0;
        border-right: 0;
        border-bottom: 0;
        border-left: 0;
        border-radius: 0;
      }

      .modal-toolbar {
        min-height: 58px;
        padding: 9px 12px;
      }

      .modal-toolbar-title { display: none; }
      .modal-toolbar .modal-links { margin-left: 0; }
      .modal-toolbar .modal-links a { min-height: 30px; padding: 6px 9px; }
      .modal-close { margin-left: auto; }
      .modal-heading { padding-top: 38px; }
      .modal-body ol, .modal-two-column { grid-template-columns: 1fr; }

      .modal-two-column section + section {
        padding-top: 28px;
        padding-left: 0;
        border-top: 1px solid var(--line);
        border-left: 0;
      }

      .site-footer {
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 6px;
        padding: 18px 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

    const dialog = document.querySelector("#project-dialog");
    const closeButton = dialog.querySelector(".modal-close");

    function openProject(id) {
      const project = projects[id];
      dialog.style.setProperty("--accent", project.accent);
      dialog.style.setProperty("--accent-soft", project.accentSoft);
      document.querySelector("#modal-toolbar-title").textContent = project.title;
      document.querySelector("#modal-category").textContent = project.number + " · " + project.category;
      document.querySelector("#modal-title").textContent = project.title;
      document.querySelector("#modal-summary").textContent = project.summary;
      document.querySelector("#modal-problem").textContent = project.problem;
      document.querySelector("#modal-reframed").textContent = project.reframed;
      document.querySelector("#modal-result").textContent = project.result;
      document.querySelector("#modal-retrospective").textContent = project.retrospective;

      const solution = document.querySelector("#modal-solution");
      solution.replaceChildren(...project.solution.map(text => {
        const item = document.createElement("li");
        item.textContent = text;
        return item;
      }));

      const links = document.querySelector("#modal-links");
      links.replaceChildren(...project.links.map(([label, href, primary]) => {
        const link = document.createElement("a");
        link.href = href;
        link.target = "_blank";
        link.rel = "noreferrer";
        link.textContent = label + " ↗";
        if (primary) link.className = "primary";
        return link;
      }));

      document.body.classList.add("modal-open");
      dialog.showModal();
      closeButton.focus();
    }

    document.querySelectorAll("[data-project]").forEach(button => {
      button.addEventListener("click", () => openProject(button.dataset.project));
    });

    closeButton.addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", event => {
      if (event.target === dialog) dialog.close();
    });
    dialog.addEventListener("close", () => document.body.classList.remove("modal-open"));
  </script>
